name: Import refined fish assets v2

on:
  push:
    paths:
      - ".github/workflows/import_refined_fish_v2.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download refined fish package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-4e78-81f4-a1d4-14d65b64d066/raw?se=2026-09-21T10%3A49%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=c80e4001-42a8-5902-8392-9a203cfd943c&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T08%3A38%3A16Z&ske=2026-09-22T08%3A38%3A16Z&sks=b&skv=2026-02-06&sig=j3FawIppsWkR43tD1nh5cjQYHDIxCAMdXiJy8EtM/vs%3D' -o /tmp/refined_fish_v2.zip
          rm -rf /tmp/refined_fish_v2
          mkdir -p /tmp/refined_fish_v2
          unzip -q /tmp/refined_fish_v2.zip -d /tmp/refined_fish_v2

      - name: Replace source frames and atlases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets_source/fish/animation_frames
          mkdir -p assets_source/specials
          mkdir -p assets/atlas/fish
          mkdir -p assets/atlas/specials

          cp -f /tmp/refined_fish_v2/assets_source/fish/animation_frames/*.png assets_source/fish/animation_frames/
          cp -f /tmp/refined_fish_v2/assets_source/specials/*.png assets_source/specials/
          cp -f /tmp/refined_fish_v2/assets/atlas/fish/* assets/atlas/fish/
          cp -f /tmp/refined_fish_v2/assets/atlas/specials/* assets/atlas/specials/
          cp -f /tmp/refined_fish_v2/REFINED_ANIMATION_NOTES.md assets_source/fish/REFINED_ANIMATION_NOTES.md

      - name: Commit refined package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets_source/fish/animation_frames assets_source/fish/REFINED_ANIMATION_NOTES.md assets_source/specials assets/atlas/fish assets/atlas/specials
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Refine fish and puffer animation frames"
          git push
