name: Import approved RU logo

on:
  push:
    paths:
      - ".github/workflows/import_approved_logo.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/logos/ru
          curl -L --fail --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-c4ac-8211-ad18-7cecd93b03ab/raw?se=2026-09-22T13%3A05%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=037c8548-beae-5a08-9ccb-a9b5a8bd746f&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T05%3A46%3A05Z&ske=2026-09-23T05%3A46%3A05Z&sks=b&skv=2026-02-06&sig=wppAu9ejEh7Qh5P1fBqGqg4LLktDy1yMrrcafEEYxCU%3D' -o assets/logos/ru/logo_gifts_from_the_deep_match3_approved.png
      - name: Commit logo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logos/ru/logo_gifts_from_the_deep_match3_approved.png
          git commit -m "Add approved Russian game logo" || exit 0
          git push
