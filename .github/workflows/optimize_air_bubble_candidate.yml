name: Optimize air bubble candidate

on:
  push:
    paths:
      - ".github/workflows/optimize_air_bubble_candidate.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resize transparent air bubble to runtime size
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          p='assets/test/specials/special_air_bubble_final_candidate.png'
          im=Image.open(p).convert('RGBA')
          im.thumbnail((352,352), Image.Resampling.LANCZOS)
          canvas=Image.new('RGBA',(352,352),(0,0,0,0))
          x=(352-im.width)//2
          y=(352-im.height)//2
          canvas.alpha_composite(im,(x,y))
          canvas.save(p,optimize=True)
          PY

      - name: Commit optimized asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/test/specials/special_air_bubble_final_candidate.png
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Optimize air bubble candidate for runtime test"
          git push
