name: Replace aligned atlases v4

on:
  push:
    paths:
      - ".github/workflows/replace_aligned_atlases_v4.yml"

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download atlas bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprukwest.oaiusercontent.com/files/00000000-690c-8243-9900-2c160b50d3f1/raw?se=2026-09-20T17%3A09%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=f67e342c-e8b8-5280-8715-bd8a219d2a55&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T15%3A05%3A50Z&ske=2026-09-21T15%3A05%3A50Z&sks=b&skv=2026-02-06&sig=%2BunUbT088EGHj1RhUTtV7xqr9egSCW1252taMcBRprs%3D' -o /tmp/atlas_v4.zip
          rm -rf /tmp/atlas_v4
          mkdir -p /tmp/atlas_v4
          unzip -q /tmp/atlas_v4.zip -d /tmp/atlas_v4
      - name: Replace fish and specials atlases
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/atlas_v4/fish_atlas.png assets/atlas/fish/fish_atlas.png
          cp /tmp/atlas_v4/fish_atlas.json assets/atlas/fish/fish_atlas.json
          cp /tmp/atlas_v4/specials_atlas.png assets/atlas/specials/specials_atlas.png
          cp /tmp/atlas_v4/specials_atlas.json assets/atlas/specials/specials_atlas.json
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/atlas/fish assets/atlas/specials
          git commit -m "Align fish animation frames to stable body anchor" || exit 0
          git push
