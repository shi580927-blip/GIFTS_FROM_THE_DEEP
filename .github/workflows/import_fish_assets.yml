name: Import fish assets

on:
  push:
    paths:
      - ".github/workflows/import_fish_assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download prepared sprites
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://sdmntprnortheu.oaiusercontent.com/files/00000000-4074-81f4-99e2-3aeff704374d/raw?se=2026-09-20T15%3A29%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=aa50da19-229b-5936-9860-c538ffa4427c&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T09%3A51%3A20Z&ske=2026-09-21T09%3A51%3A20Z&sks=b&skv=2026-02-06&sig=SIvonXPrIUXue/%2Bk%2Bx7aufF1lcKwezbqAP8/p/aL9hA%3D' \
            -o /tmp/cut_fish_sprites.zip
          rm -rf /tmp/fish_import
          mkdir -p /tmp/fish_import
          unzip -q /tmp/cut_fish_sprites.zip -d /tmp/fish_import

      - name: Place sprites into asset structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets_source/fish/animation_frames
          mkdir -p assets_source/specials
          cp /tmp/fish_import/fish_*.png assets_source/fish/animation_frames/
          cp /tmp/fish_import/special_puffer_*.png assets_source/specials/

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets_source/fish/animation_frames assets_source/specials
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Add fish animation frames and puffer sprites"
          git push
