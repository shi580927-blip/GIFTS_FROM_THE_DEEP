name: Import final fish assets

on:
  push:
    paths:
      - ".github/workflows/import_final_fish_assets.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download final fish bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-1214-8211-a7d7-1cd4e89f44c3/raw?se=2026-09-21T10%3A21%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=cc97e848-e92c-5e60-8fd7-944845b3e47b&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T06%3A28%3A21Z&ske=2026-09-22T06%3A28%3A21Z&sks=b&skv=2026-02-06&sig=NocgW%2BA40pL0HdNpVACizGC5t7DtFN%2BaNR/BIBbhjKw%3D' -o /tmp/final_fish_assets_bundle.zip
          rm -rf /tmp/final_fish
          mkdir -p /tmp/final_fish
          unzip -q /tmp/final_fish_assets_bundle.zip -d /tmp/final_fish

      - name: Replace source frames and runtime atlases
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p assets_source/fish/animation_frames
          mkdir -p assets_source/specials
          mkdir -p assets/atlas/fish
          mkdir -p assets/atlas/specials

          rm -f assets_source/fish/animation_frames/fish_02_blue_tang_f02.png
          rm -f assets_source/fish/animation_frames/fish_02_blue_tang_f03.png
          rm -f assets_source/fish/animation_frames/fish_03_moorish_idol_f02.png
          rm -f assets_source/fish/animation_frames/fish_03_moorish_idol_f03.png
          rm -f assets_source/fish/animation_frames/fish_04_white_angelfish_f02.png
          rm -f assets_source/fish/animation_frames/fish_04_white_angelfish_f03.png
          rm -f assets_source/fish/animation_frames/fish_05_yellow_tang_f02.png
          rm -f assets_source/fish/animation_frames/fish_05_yellow_tang_f03.png

          cp -f /tmp/final_fish/assets_source/fish/animation_frames/*.png assets_source/fish/animation_frames/
          cp -f /tmp/final_fish/assets_source/specials/*.png assets_source/specials/
          cp -f /tmp/final_fish/assets/atlas/fish/* assets/atlas/fish/
          cp -f /tmp/final_fish/assets/atlas/specials/* assets/atlas/specials/

      - name: Commit final fish package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets_source/fish/animation_frames assets_source/specials assets/atlas/fish assets/atlas/specials
          if git diff --cached --quiet; then
            echo "No fish asset changes to commit."
            exit 0
          fi
          git commit -m "Finalize fish animation frames and puffer stages"
          git push
