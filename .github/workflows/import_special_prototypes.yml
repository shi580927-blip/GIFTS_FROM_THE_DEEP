name: Import special element prototypes

on:
  push:
    paths:
      - ".github/workflows/import_special_prototypes.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download prototype pack
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-318c-8210-bb9e-6eefb3db1178/raw?se=2026-09-21T11%3A28%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=1661e876-5892-575d-a638-6ffe6ff38d61&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T04%3A46%3A23Z&ske=2026-09-22T04%3A46%3A23Z&sks=b&skv=2026-02-06&sig=TH5B7oRKgAgX1gcGtFQdcUZCUDTgXMPyVk0m1u%2Br8/c%3D' -o /tmp/specials.zip
          mkdir -p assets/test/specials
          unzip -qo /tmp/specials.zip -d assets/test/specials

      - name: Commit prototype assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/test/specials
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Add special element prototype assets"
          git push
