name: Import blocker assets v1

on:
  push:
    paths:
      - ".github/workflows/import_blockers_v1.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download blockers package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-02cc-81f4-bac9-4637fcfc8bad/raw?se=2026-09-22T16%3A28%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=cb4219be-4482-534e-9920-7d905f396ebc&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T16%3A21%3A34Z&ske=2026-09-23T16%3A21%3A34Z&sks=b&skv=2026-02-06&sig=lyP6mMD5IH3RHzHgubnIALTpJuq0ZyI5nXB5%2BX2%2BXO8%3D' -o /tmp/blockers.zip
          rm -rf /tmp/blockers_unpack
          mkdir -p /tmp/blockers_unpack
          unzip -q /tmp/blockers.zip -d /tmp/blockers_unpack
          mkdir -p assets_source/blockers assets/atlas/blockers
          cp -f /tmp/blockers_unpack/assets_source/blockers/*.png assets_source/blockers/
          cp -f /tmp/blockers_unpack/assets/atlas/blockers/* assets/atlas/blockers/

      - name: Commit blocker assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets_source/blockers assets/atlas/blockers
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Add approved blocker assets and atlases v1"
          git push
