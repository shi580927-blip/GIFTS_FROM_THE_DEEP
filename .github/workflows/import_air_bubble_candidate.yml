name: Import final air bubble candidate

on:
  push:
    paths:
      - ".github/workflows/import_air_bubble_candidate.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download air bubble candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/test/specials
          curl -L --fail --retry 3 'https://sdmntpreastus.oaiusercontent.com/files/00000000-b504-81f9-8429-16f1a9aab714/raw?se=2026-09-21T12%3A57%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=b3b73458-304f-5d1e-81ef-47237d5789a3&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T07%3A27%3A39Z&ske=2026-09-22T07%3A27%3A39Z&sks=b&skv=2026-02-06&sig=HTTd4Rogan7MFz5mxBhlFHtV4G%2BUFNIlMheqVrfj0t8%3D' -o assets/test/specials/special_air_bubble_final_candidate.png

      - name: Commit asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/test/specials/special_air_bubble_final_candidate.png
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Add transparent air bubble candidate"
          git push
