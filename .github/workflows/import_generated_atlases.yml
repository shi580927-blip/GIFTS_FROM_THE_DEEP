name: Import generated atlases

on:
  push:
    paths:
      - ".github/workflows/import_generated_atlases.yml"

permissions:
  contents: write

jobs:
  import-atlases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download generated atlases
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-824c-8246-890e-181c3ea75447/raw?se=2026-09-20T16%3A38%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=4dcf61cd-ff97-5da9-8af2-cbdfbc70903d&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T15%3A35%3A09Z&ske=2026-09-21T15%3A35%3A09Z&sks=b&skv=2026-02-06&sig=KBvfuw4uPQJvNvE9/qtVCkoeaLvS9GPpP9enfnGOjAE%3D' \
            -o /tmp/atlases.zip
          rm -rf /tmp/atlases
          mkdir -p /tmp/atlases
          unzip -q /tmp/atlases.zip -d /tmp/atlases

      - name: Place atlas files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/atlas/fish assets/atlas/specials
          cp /tmp/atlases/fish_atlas.png assets/atlas/fish/fish_atlas.png
          cp /tmp/atlases/fish_atlas.json assets/atlas/fish/fish_atlas.json
          cp /tmp/atlases/specials_atlas.png assets/atlas/specials/specials_atlas.png
          cp /tmp/atlases/specials_atlas.json assets/atlas/specials/specials_atlas.json

      - name: Commit atlas files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/atlas/fish assets/atlas/specials
          if git diff --cached --quiet; then
            echo "No atlas changes to commit."
            exit 0
          fi
          git commit -m "Add generated fish and specials atlases"
          git push
